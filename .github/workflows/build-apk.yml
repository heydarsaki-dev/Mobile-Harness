name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by app/build.gradle.kts. The GitHub runner image does not ship
  # these versions, so they are installed explicitly below.
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build online release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd unzip
          command -v zstd
          command -v unzip
          command -v python3

      - name: Install pinned NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "SDK_ROOT=$SDK_ROOT"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found at $SDKMANAGER" >&2; exit 1; }

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true

          # Preferred path: let sdkmanager resolve the pinned components.
          if "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
                --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"; then
            echo "sdkmanager installed the pinned NDK/CMake"
          else
            # Fallback: sdkmanager drops older components from its repository,
            # so pull the exact archives from Google's download server instead.
            echo "::warning::sdkmanager could not install the pinned versions; downloading directly"

            echo "Downloading NDK r26b"
            curl -fL --retry 3 -o /tmp/ndk.zip \
              "https://dl.google.com/android/repository/android-ndk-r26b-linux.zip"
            rm -rf /tmp/ndk-x && mkdir -p /tmp/ndk-x
            unzip -q /tmp/ndk.zip -d /tmp/ndk-x
            ndk_props="$(find /tmp/ndk-x -maxdepth 3 -type f -name source.properties | head -n 1)"
            test -n "$ndk_props" || { echo "NDK archive layout unexpected" >&2; exit 1; }
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            mkdir -p "$SDK_ROOT/ndk"
            mv "$(dirname "$ndk_props")" "$SDK_ROOT/ndk/$NDK_VERSION"

            echo "Downloading CMake $CMAKE_VERSION"
            curl -fL --retry 3 -o /tmp/cmake.zip \
              "https://dl.google.com/android/repository/cmake-${CMAKE_VERSION}-linux.zip"
            rm -rf /tmp/cmake-x && mkdir -p /tmp/cmake-x
            unzip -q /tmp/cmake.zip -d /tmp/cmake-x
            cmake_bin="$(find /tmp/cmake-x -maxdepth 4 -type f -path '*/bin/cmake' | head -n 1)"
            test -n "$cmake_bin" || { echo "CMake archive layout unexpected" >&2; exit 1; }
            rm -rf "$SDK_ROOT/cmake/$CMAKE_VERSION"
            mkdir -p "$SDK_ROOT/cmake"
            mv "${cmake_bin%/bin/cmake}" "$SDK_ROOT/cmake/$CMAKE_VERSION"
          fi

          # Keep source.properties authoritative so AGP resolves the NDK.
          current="$(sed -n 's/^Pkg\.Revision *= *//p' "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" | tr -d '\r' | head -n 1)"
          echo "NDK Pkg.Revision: $current"
          if [ "$current" != "$NDK_VERSION" ]; then
            echo "::warning::normalising NDK revision $current -> $NDK_VERSION"
            sed -i "s/^Pkg\.Revision *=.*/Pkg.Revision = $NDK_VERSION/" \
              "$SDK_ROOT/ndk/$NDK_VERSION/source.properties"
          fi

          test -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties"
          test -x "$SDK_ROOT/cmake/$CMAKE_VERSION/bin/cmake"
          "$SDK_ROOT/cmake/$CMAKE_VERSION/bin/cmake" --version

      - name: Build Antigravity runtime bundle
        run: |
          chmod +x gradlew
          chmod +x scripts/runtime-bundles/build-agy-from-official.sh
          scripts/runtime-bundles/build-agy-from-official.sh

      # The keystore lives in the Actions cache so every rebuild after the first
      # one is signed with the same key, which is what lets Android accept an
      # update over an already-installed build.
      - name: Restore signing keystore
        id: keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: signing
          key: mh-release-keystore-v1

      - name: Create signing keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          pw="$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)"
          printf '%s' "$pw" > signing/password.txt
          keytool -genkeypair -v -keystore signing/release.jks -storetype PKCS12 \
            -storepass "$pw" -keypass "$pw" -alias mobileharness \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -dname "CN=Mobile Harness, OU=Release Signing, O=heydarsaki-dev, C=US"

      - name: Persist signing keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: signing
          key: mh-release-keystore-v1

      - name: Export signing credentials
        shell: bash
        run: |
          set -euo pipefail
          pw="$(cat signing/password.txt)"
          {
            echo "MH_UPLOAD_STORE_FILE=signing/release.jks"
            echo "MH_UPLOAD_KEY_ALIAS=mobileharness"
            echo "MH_UPLOAD_STORE_PASSWORD=$pw"
            echo "MH_UPLOAD_KEY_PASSWORD=$pw"
          } >> "$GITHUB_ENV"
          echo "signing certificate in use:"
          keytool -list -v -keystore signing/release.jks -storepass "$pw" -alias mobileharness \
            | grep -E "Owner|Valid from"

      - name: Build APK
        run: ./gradlew --no-daemon assembleOnlineRelease

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(ls app/build/outputs/apk/online/release/*.apk | head -n 1)"
          echo "APK=$apk"
          ls -lh "$apk"
          build_tools="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$build_tools/aapt2" dump badging "$apk" | head -n 12
          "$build_tools/aapt2" dump badging "$apk" | grep -E "native-code|sdkVersion|targetSdkVersion" || true
          "$build_tools/apksigner" verify --verbose "$apk" | head -n 10
          sha256sum "$apk" | tee app/build/outputs/apk/online/release/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-apk
          path: app/build/outputs/apk/online/release/
          if-no-files-found: error
          retention-days: 30

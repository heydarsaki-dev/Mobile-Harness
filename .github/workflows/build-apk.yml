name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build online debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          sdkmanager --licenses <<< "y"

      - name: Build Antigravity runtime bundle
        run: |
          chmod +x scripts/runtime-bundles/build-agy-from-official.sh
          scripts/runtime-bundles/build-agy-from-official.sh

      - name: Build APK
        run: ./gradlew --no-daemon assembleOnlineDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-online-debug
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error
